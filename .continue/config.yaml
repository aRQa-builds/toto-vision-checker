#
# ⚠⚠ THE TIER-1 HASH CHECK IN /open AND /close COMPARES EACH COPY TO THE MASTER.
# A DIFF against Coffee_Crew_HQ is real drift — resolve it by mirroring from here,
# not by copying one repo's copy over another's. What must stay reconciled is the
# MODEL CONFIG, not just the bytes. Verify that too:
#   one holder of [chat, edit, apply] · hand.model == scout.model · hand.ctx == scout.ctx
# This copy is checked for DIFF against Coffee_Crew_HQ specifically (the master) —
# a DIFF there is real drift and should be resolved; a DIFF against a *different*
# repo's copy is expected and not actionable.
#
# ⚠ think:false IS MANDATORY AND THIS FILE CANNOT EXPRESS IT.
# qwen3.5:9b advertises `thinking`. With thinking ON, a measured 30-line route edit
# returned the file BYTE-IDENTICAL to the input — a silent no-op that compiles green
# — while burning 5468 output tokens against 298 with thinking off. Continue's
# defaultCompletionOptions has no `think` key, so any caller driving hand-9b through
# the Ollama API must pass "think": false explicitly. A call that omits it is not a
# valid attempt and its result must not be tallied.
#
# If num_ctx changes again, or Apply is repointed, re-run the readings above before
# any delegation is counted.
