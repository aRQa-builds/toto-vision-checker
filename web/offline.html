<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D0A1E">
<title>Offline · TOTO &amp; 4D Check</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0D0A1E;color:#F4F1FF;
     font-family:'DM Mono',ui-monospace,monospace;padding:16px;box-sizing:border-box;text-align:center}
.card{max-width:360px;border-radius:28px;background:#17123A;border:1.5px dashed #3B3270;padding:28px 20px}
h1{font-family:'Unbounded',system-ui,sans-serif;font-size:21px;margin:12px 0 8px}
p{color:#9A93C9;font-size:13px;line-height:1.6;margin:0 0 16px}
button{border:0;border-radius:999px;padding:14px 22px;background:#36E2D0;color:#0D0A1E;font:700 14px system-ui,sans-serif;min-height:48px;cursor:pointer}
img{width:72px;height:72px;border-radius:18px}
</style>
</head>
<body>
<div class="card">
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Checking a ticket needs a connection to the checker. Your ticket is safe on paper; try again when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
